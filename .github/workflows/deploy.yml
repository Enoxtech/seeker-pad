name: Build SeekerPad Contract

on:
  push:
    branches: [main]
    paths:
      - 'smart-contract/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download Solana CLI
        run: |
          cd /tmp
          wget -q https://github.com/solana-labs/solana/releases/download/v1.14.6/solana-release-x86_64-unknown-linux-gnu.tar.bz2
          tar xjf solana-release-x86_64-unknown-linux-gnu.tar.bz2
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH

      - name: Verify Solana
        run: solana --version

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Anchor
        run: npm install -g @coral-xyz/anchor@0.26.0

      - name: Build contract (capture all output)
        run: |
          export PATH="/tmp/solana-release/bin:$PATH"
          cd smart-contract
          npm install 2>&1
          npx anchor build 2>&1
        env:
          DEBUG: "*"

      - name: Check target folder
        run: |
          echo "=== Target folder ==="
          ls -la smart-contract/target/ 2>&1 || echo "No target"
          echo "=== Deploy folder ==="
          ls -la smart-contract/target/deploy/ 2>&1 || echo "No deploy"
          echo "=== All .so files ==="
          find smart-contract -name "*.so" 2>&1 || echo "No .so"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: seekerpad-build
          path: smart-contract/target
          retention-days: 30
