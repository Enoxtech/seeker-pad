name: Build Smart Contract

on:
  push:
    branches: [main]
    paths:
      - 'smart-contract/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Anchor
        uses: solana-fm/anchor-build-action@v1.0.0
        with:
          anchor-version: 0.26.0
          solana-version: 1.14.6

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: seekerpad-so
          path: smart-contract/target/deploy/seekerpad.so
          retention-days: 30
