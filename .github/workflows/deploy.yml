name: Build Smart Contract

on:
  push:
    branches: [main]
    paths:
      - 'smart-contract/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL 'https://release.anza.xyz/v1.14.6/stable/install')"
        shell: bash

      - name: Add Solana to PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Build with cargo build-sbf
        working-directory: ./smart-contract
        run: |
          source $HOME/.local/share/solana/install/active_release/env
          cargo build-bpf --program-target bpfel-unknown-unknown -Z unstable-cmdflags
        shell: bash
