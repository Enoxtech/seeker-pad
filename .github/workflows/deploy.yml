name: Build Smart Contract

on:
  push:
    branches: [main]
    paths:
      - 'smart-contract/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/coral-xyz/anchor:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Anchor
        run: anchor --version

      - name: Build contract
        working-directory: ./smart-contract
        run: anchor build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: seekerpad-so
          path: smart-contract/target/deploy/seekerpad.so
          retention-days: 30
