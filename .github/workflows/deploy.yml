name: Build Smart Contract

on:
  push:
    branches: [main]
    paths:
      - 'smart-contract/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL 'https://release.anza.xyz/v1.14.6/stable/install')"
        shell: bash

      - name: Add Solana to PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Verify Solana
        run: |
          source $HOME/.local/share/solana/install/active_release/env
          solana --version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Anchor CLI locally
        working-directory: ./smart-contract
        run: npm install @coral-xyz/anchor@0.26.0

      - name: Build contract
        working-directory: ./smart-contract
        run: |
          source $HOME/.local/share/solana/install/active_release/env
          npx anchor build
