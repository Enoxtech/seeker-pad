name: Build Smart Contract

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./smart-contract -> target

      - name: Build Anchor
        uses: lightprotocol/anchor-action@master
        with:
          anchor_version: v0.26.0

      - name: Build smart contract
        working-directory: ./smart-contract
        run: anchor build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anchor-build
          path: smart-contract/target/deploy/*.so
          retention-days: 7
